<svg xmlns="http://www.w3.org/2000/svg" width="360" height="446" viewBox="0 0 360 446" font-family="Menlo,Consolas,monospace">
<rect width="360" height="446" fill="#ffffff"/>
<text x="180.0" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Tasks into weeks  H=4  → 3 weeks</text>
<line x1="180.0" y1="312" x2="180.0" y2="358" stroke="#94a3b8" stroke-width="1.6"/>
<text x="180.0" y="344.52" text-anchor="middle" font-size="11" fill="#b45309" stroke="#ffffff" stroke-width="4" paint-order="stroke" font-weight="bold">week 3..3 +1</text>
<line x1="180.0" y1="214" x2="180.0" y2="260" stroke="#94a3b8" stroke-width="1.6"/>
<text x="180.0" y="246.52" text-anchor="middle" font-size="11" fill="#b45309" stroke="#ffffff" stroke-width="4" paint-order="stroke" font-weight="bold">week 1..2 +1</text>
<line x1="180.0" y1="116" x2="180.0" y2="162" stroke="#94a3b8" stroke-width="1.6"/>
<text x="180.0" y="148.52" text-anchor="middle" font-size="11" fill="#b45309" stroke="#ffffff" stroke-width="4" paint-order="stroke" font-weight="bold">week 0..0 +1</text>
<circle cx="180.0" cy="384" r="26" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="180.0" y="381" text-anchor="middle" font-size="12" fill="#065f46">f(4)</text>
<text x="180.0" y="398" text-anchor="middle" font-size="13" font-weight="bold" fill="#065f46">= 0</text>
<circle cx="180.0" cy="286" r="26" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="180.0" y="283" text-anchor="middle" font-size="12" fill="#0f172a">f(3)</text>
<text x="180.0" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">= 1</text>
<circle cx="180.0" cy="188" r="26" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="180.0" y="185" text-anchor="middle" font-size="12" fill="#0f172a">f(1)</text>
<text x="180.0" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">= 2</text>
<circle cx="180.0" cy="90" r="26" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="180.0" y="87" text-anchor="middle" font-size="12" fill="#1e3a8a">f(0)</text>
<text x="180.0" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">= 3</text>
</svg>