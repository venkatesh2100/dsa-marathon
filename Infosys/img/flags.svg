<text x="330" y="149" font-size="13" fill="#0f172a" text-anchor="start">len 7 (not exact): 3 cuts → 3 flags  (1 per cut)</text>
<text x="30" y="200" font-size="12" fill="#b45309" text-anchor="start" font-weight="bold">Rule: every cut = 1 flag. Exact multiples give +1 bonus when fully cut.</text>
